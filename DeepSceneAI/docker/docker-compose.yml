services:
  deepscene-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ../results:/app/results
    restart: unless-stopped
  deepscene-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEEPSCENE_CORS_ORIGINS: "http://localhost:8501"
    restart: unless-stopped
